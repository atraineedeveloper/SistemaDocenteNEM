name: Update import documentation

on:
  push:
    branches:
      - feature/student-import-xlsx-csv

permissions:
  contents: write

jobs:
  update:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: feature/student-import-xlsx-csv
      - name: Refresh maintained documentation and remove temporary workflow
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          readme = Path('README.md')
          text = readme.read_text(encoding='utf-8')
          text = text.replace(
              '- group/school context;\n- Demo mode with isolated fictitious data;',
              '- group/school context;\n- safe student import from XLSX/CSV with preview, correction and atomic commit;\n- Demo mode with isolated fictitious data;',
              1)
          text = text.replace(
              'The current stacked development work adds structured primary grades, automatic NEM phases, multigrade support, school organization, student grade, offline Mexico entity/municipality catalogs and structured NEM project planning. Projects can carry a NEM methodology and target grades; activities can carry one formative field and an explicit grade scope while preserving their historical student roster. See [`docs/nem-project-planning.md`](docs/nem-project-planning.md).',
              'The current product includes structured primary grades, automatic NEM phases, multigrade support, school organization, student grade, offline Mexico entity/municipality catalogs and structured NEM project planning. Projects can carry a NEM methodology and target grades; activities can carry one formative field and an explicit grade scope while preserving their historical student roster. The current import workflow adds safe XLSX/CSV roster ingestion without overwriting existing students. See [`docs/nem-project-planning.md`](docs/nem-project-planning.md) and [`docs/student-import.md`](docs/student-import.md).',
              1)
          text = text.replace('- OpenSpec\n- Git / GitHub Actions', '- OpenSpec\n- Open XML SDK for XLSX interchange\n- Git / GitHub Actions', 1)
          text = text.replace(
              'Major upcoming areas include XLSX/CSV import, exports, backup/restore and additional reporting outputs.',
              'Major upcoming areas after student import include XLSX/CSV exports, backup/restore and additional reporting outputs.',
              1)
          readme.write_text(text, encoding='utf-8')

          architecture = Path('docs/architecture.md')
          text = architecture.read_text(encoding='utf-8')
          text = text.replace(
              '| `SistemaDocente.Application` | Use cases, persistence ports, snapshots and orchestration between aggregates. |\n| `SistemaDocente.Data` |',
              '| `SistemaDocente.Application` | Use cases, persistence/interchange ports, snapshots and orchestration between aggregates. |\n| `SistemaDocente.Interchange` | File-format adapters for neutral tabular interchange. It currently reads XLSX and UTF-8 CSV for student import without depending on WPF or SQLite. |\n| `SistemaDocente.Data` |',
              1)
          text = text.replace(
              'Test projects mirror the production layers: Core, Application, Data, Presentation and WPF. Reporting tests currently live in Application tests.',
              'Test projects mirror Core, Application, Data, Presentation and WPF. Reporting tests and Interchange adapter tests currently live in Application tests.',
              1)
          text = text.replace(
              'Data         → Application + Core\nPresentation → Application + Reporting',
              'Data         → Application + Core\nInterchange  → Application\nPresentation → Application + Reporting',
              1)
          marker = '## SQLite persistence\n'
          section = '''## Tabular interchange and student import\n\nStudent import uses an explicit adapter boundary rather than putting spreadsheet parsing in WPF or SQLite. `SistemaDocente.Interchange` implements Application-owned neutral tabular contracts for `.xlsx` and UTF-8 `.csv`. XLSX parsing reads stored cell values only; CSV supports quoted fields plus comma, semicolon and tab delimiters, with explicit teacher resolution when delimiter detection is ambiguous.\n\nApplication owns column mapping, deterministic normalization, unigrade/multigrade grade resolution, list-number conflicts, probable-duplicate review and the final commit boundary. Preview/corrections remain in memory and never rewrite the source file. Immediately before confirmation, Application reloads the current group/context, revalidates every included row, mutates a cloned `Grupo` aggregate and calls `IAlmacenamientoGrupos.Guardar` exactly once. The existing SQLite aggregate transaction therefore makes a confirmed multi-row import all-or-nothing.\n\nPresentation owns wizard state (`Archivo → Columnas → Vista previa → Confirmación → Resultado`) while WPF owns only desktop-specific file selection and window behavior. Existing students are never overwritten/reactivated implicitly, CURP is not an import destination and imported students do not enter historical attendance/activity/evaluation rosters retroactively. See [`student-import.md`](student-import.md).\n\n'''
          if marker not in text:
              raise SystemExit('architecture SQLite marker not found')
          text = text.replace(marker, section + marker, 1)
          text = text.replace(
              'Complex tasks remain in dedicated windows, including student editing, project/activity detail, student record, evaluation-cell detail and structured group configuration.',
              'Complex tasks remain in dedicated windows, including student editing, student import, project/activity detail, student record, evaluation-cell detail and structured group configuration.',
              1)
          architecture.write_text(text, encoding='utf-8')

          checklist = Path('checklist_modulos_sistema_docente_nem.md')
          text = checklist.read_text(encoding='utf-8')
          text = text.replace('## Current stacked changes: structured school context and NEM planning', '## Structured school context and NEM planning')
          text = text.replace('- [~] **School context, NEM phase and multigrade foundation** — PR #11 / `feature/nem-multigrade-catalogs`', '- [x] **School context, NEM phase and multigrade foundation**')
          text = text.replace('  - [ ] Complete manual unigrade/multigrade UX validation.', '  - [x] Manual unigrade/multigrade UX validation completed before merge.')
          text = text.replace('- [~] **Structured NEM project/activity metadata** — PR #12 / `feature/nem-project-planning-catalogs`', '- [x] **Structured NEM project/activity metadata**')
          text = text.replace('  - [ ] Complete manual Demo UX validation and normalize the stacked branch after PR #11 merges.', '  - [x] Manual Demo UX validation and normalized merge completed.')
          text = text.replace('The structured methodology/formative-field/grade foundation is implemented in the current PR #12.', 'The structured methodology/formative-field/grade foundation is implemented in `main`.')

          old_import = '''## 10. Student import\n\n- [ ] Import `.xlsx` and `.csv`.\n- [ ] Preview before writing.\n- [ ] Map source columns to application fields.\n- [ ] Validate headers/data types and required fields.\n- [ ] Detect probable duplicates.\n- [ ] Allow corrections or row exclusion before commit.\n- [ ] Use one transaction for the confirmed import.\n- [ ] Show imported / skipped / needs-review counts.\n- [ ] For a unigrade group, default missing grade to the group's only grade.\n- [ ] For a multigrade group, require or resolve student grade explicitly.\n- [ ] Never overwrite existing students without explicit confirmation.\n'''
          new_import = '''## 10. Student import\n\n**Current feature branch:** `feature/student-import-xlsx-csv` / PR #15. Automated implementation is complete pending final CI/manual acceptance.\n\n- [x] Import `.xlsx` and UTF-8 `.csv`.\n- [x] Preview before any SQLite write.\n- [x] Map source columns only to supported student fields; CURP is excluded.\n- [x] Validate headers/data types and required fields.\n- [x] Detect hard list-number conflicts and deterministic probable duplicates.\n- [x] Allow in-memory corrections, row exclusion and explicit `import as new` review decisions.\n- [x] Resolve ambiguous CSV delimiters explicitly (comma / semicolon / tab).\n- [x] Revalidate against a fresh group/context snapshot before commit.\n- [x] Use one aggregate save / SQLite transaction for the confirmed import.\n- [x] Prove rollback when a later SQLite insert fails.\n- [x] Show ready / needs-review / invalid / excluded counts plus final imported/excluded counts.\n- [x] For a unigrade group, default a missing grade to the group's only configured grade.\n- [x] For a multigrade or unconfigured group, require explicit grade resolution.\n- [x] Never overwrite, reactivate or deactivate existing students implicitly.\n- [x] Keep imported students out of historical attendance/activity/evaluation rosters.\n- [x] Keep raw workbook rows out of technical logs.\n- [ ] Complete manual XLSX/CSV validation in supported themes and scaling before merge.\n'''
          if old_import not in text:
              raise SystemExit('student import roadmap block not found')
          text = text.replace(old_import, new_import, 1)

          old_sequence = '''1. [~] Complete manual validation and merge the structured school-context/multigrade foundation (PR #11).\n2. [~] Normalize, manually validate and merge structured NEM project/activity metadata (PR #12).\n3. [ ] Implement student XLSX/CSV import.\n4. [ ] Implement data XLSX/CSV export.\n5. [ ] Implement backup/restore before production use with irreplaceable real data.\n6. [ ] Extend richer NEM planning fields, evaluation criteria/rubrics and reporting periods.\n7. [ ] Add PDF/print report outputs.\n8. [ ] Add teacher journal, family workflow, evidence attachments and calendar as prioritized.\n9. [ ] Harden privacy, installer/update and long-term support workflows.'''
          new_sequence = '''1. [x] Merge structured school-context/multigrade foundation.\n2. [x] Merge structured NEM project/activity metadata.\n3. [~] Complete manual validation and merge student XLSX/CSV import (PR #15).\n4. [ ] Implement data XLSX/CSV export.\n5. [ ] Implement backup/restore before production use with irreplaceable real data.\n6. [ ] Extend richer NEM planning fields, evaluation criteria/rubrics and reporting periods.\n7. [ ] Add PDF/print report outputs.\n8. [ ] Add teacher journal, family workflow, evidence attachments and calendar as prioritized.\n9. [ ] Harden privacy, installer/update and long-term support workflows.'''
          if old_sequence not in text:
              raise SystemExit('development sequence block not found')
          text = text.replace(old_sequence, new_sequence, 1)
          checklist.write_text(text, encoding='utf-8')
          PY
          git rm .github/workflows/update-import-documentation.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md docs/architecture.md checklist_modulos_sistema_docente_nem.md
          git commit -m "docs: refresh roadmap and architecture for student import"
          git push origin HEAD:feature/student-import-xlsx-csv
