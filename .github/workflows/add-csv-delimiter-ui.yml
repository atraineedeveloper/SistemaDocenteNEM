name: Add CSV delimiter UI

on:
  push:
    branches:
      - feature/student-import-xlsx-csv

permissions:
  contents: write

jobs:
  update:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: feature/student-import-xlsx-csv
      - name: Add delimiter chooser and remove temporary workflow
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('src/SistemaDocente.App.Wpf/ImportacionEstudiantesWindow.xaml')
          text = path.read_text(encoding='utf-8')
          old = '''                        <TextBlock Text="{Binding Mensaje}" Margin="0,12,0,0" Foreground="{DynamicResource ErrorBrush}" TextWrapping="Wrap"/>\n'''
          new = old + '''                        <Border Margin="0,14,0,0" Padding="14" CornerRadius="8"\n                                Background="{DynamicResource InfoBackgroundBrush}"\n                                BorderBrush="{DynamicResource InfoBrush}" BorderThickness="1"\n                                Visibility="{Binding RequiereDelimitadorCsv, Converter={StaticResource BoolToVisibility}}">\n                            <StackPanel>\n                                <TextBlock Text="Selecciona el delimitador del CSV" FontWeight="SemiBold"/>\n                                <TextBlock Margin="0,4,0,10" TextWrapping="Wrap"\n                                           Foreground="{DynamicResource TextSecondaryBrush}"\n                                           Text="El archivo puede usar coma, punto y coma o tabulador. Elige cuál separa sus columnas y vuelve a intentarlo."/>\n                                <StackPanel Orientation="Horizontal">\n                                    <ComboBox Width="230" Margin="0,0,10,0"\n                                              ItemsSource="{Binding OpcionesDelimitadoresCsv}"\n                                              DisplayMemberPath="Etiqueta"\n                                              SelectedItem="{Binding DelimitadorCsvSeleccionado, Mode=TwoWay}"\n                                              AutomationProperties.Name="Delimitador del archivo CSV"/>\n                                    <Button Style="{StaticResource PrimaryButton}" Content="Reintentar CSV"\n                                            Command="{Binding ReintentarCsvCommand}"/>\n                                </StackPanel>\n                            </StackPanel>\n                        </Border>\n'''
          if old not in text:
              raise SystemExit('Message marker not found in import window')
          text = text.replace(old, new, 1)
          path.write_text(text, encoding='utf-8')
          PY
          git rm .github/workflows/add-csv-delimiter-ui.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/SistemaDocente.App.Wpf/ImportacionEstudiantesWindow.xaml
          git commit -m "feat: add explicit CSV delimiter choice to import wizard"
          git push origin HEAD:feature/student-import-xlsx-csv
