name: CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"
  DOTNET_NOLOGO: "1"
  OPENSPEC_TELEMETRY: "0"

jobs:
  validate:
    name: Windows · audit · format · build · test · coverage · OpenSpec
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: .NET version
        shell: pwsh
        run: dotnet --version

      - name: Restore and audit NuGet dependencies
        shell: pwsh
        run: dotnet restore SistemaDocente.sln -p:AuditPipeline=true

      - name: Verify formatting
        shell: pwsh
        run: dotnet format SistemaDocente.sln --verify-no-changes --no-restore

      - name: Build
        shell: pwsh
        run: dotnet build SistemaDocente.sln --configuration Release --no-restore

      - name: Test and collect coverage
        shell: pwsh
        run: >
          dotnet test SistemaDocente.sln
          --configuration Release
          --no-build
          --collect:"XPlat Code Coverage"
          --settings .\eng\coverage.runsettings
          --results-directory .\artifacts\coverage

      - name: Upload Cobertura coverage
        uses: actions/upload-artifact@v7
        with:
          name: aularaiz-coverage-cobertura
          path: artifacts/coverage/**/coverage.cobertura.xml
          if-no-files-found: error
          retention-days: 14

      - name: Setup Node.js 24
        uses: actions/setup-node@v6
        with:
          node-version: 24.x
          package-manager-cache: false

      - name: Install OpenSpec
        shell: pwsh
        run: npm install --global @fission-ai/openspec@1.6.0

      - name: OpenSpec version
        shell: pwsh
        run: openspec --version

      - name: Validate OpenSpec
        shell: pwsh
        run: openspec validate --all

      - name: Check whitespace errors
        shell: pwsh
        run: git diff --check