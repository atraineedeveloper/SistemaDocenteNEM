name: Cleanup merged feature branches

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  cleanup:
    if: github.head_ref == 'chore/cleanup-merged-branches'
    runs-on: ubuntu-latest
    steps:
      - name: Delete obsolete merged branches
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail

          delete_branch() {
            local branch="$1"
            local encoded="${branch//\//%2F}"
            local response_file
            response_file="$(mktemp)"
            local status
            status="$(curl --silent --show-error \
              --output "${response_file}" \
              --write-out "%{http_code}" \
              --request DELETE \
              --header "Accept: application/vnd.github+json" \
              --header "Authorization: Bearer ${GH_TOKEN}" \
              --header "X-GitHub-Api-Version: 2022-11-28" \
              "https://api.github.com/repos/${REPOSITORY}/git/refs/heads/${encoded}")"

            case "${status}" in
              204)
                echo "Deleted ${branch}."
                ;;
              404|422)
                echo "${branch} is already absent or cannot be deleted; continuing."
                ;;
              *)
                echo "Failed to delete ${branch}; HTTP ${status}."
                cat "${response_file}"
                exit 1
                ;;
            esac
            rm -f "${response_file}"
          }

          delete_branch "feature/group-export-xlsx-csv"
          delete_branch "feature/local-backup-restore"
          delete_branch "feature/aularaiz-branding"
          delete_branch "chore/cleanup-merged-branches"
