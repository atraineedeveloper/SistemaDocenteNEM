name: Cleanup obsolete branches

on:
  push:
    branches:
      - feature/student-import-xlsx-csv

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Delete obsolete remote branches
        shell: bash
        run: |
          git push origin --delete \
            feature/nem-multigrade-catalogs \
            feature/nem-project-planning-catalogs \
            feature/ux-group-workspace-grids \
            normalize/nem-project-planning-catalogs \
            normalize/student-import-xlsx-csv \
            spec/student-import-xlsx-csv
