name: Add Interchange project to solution

on:
  push:
    branches:
      - feature/student-import-xlsx-csv

permissions:
  contents: write

jobs:
  update-solution:
    if: github.actor != 'github-actions[bot]'
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: feature/student-import-xlsx-csv
      - name: Setup .NET 10
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x
      - name: Add Interchange project and remove temporary workflow
        shell: pwsh
        run: |
          dotnet sln SistemaDocente.sln add .\src\SistemaDocente.Interchange\SistemaDocente.Interchange.csproj --solution-folder src
          git rm .github/workflows/add-interchange-to-solution.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add SistemaDocente.sln
          git commit -m "build: add interchange project to solution"
          git push origin HEAD:feature/student-import-xlsx-csv
