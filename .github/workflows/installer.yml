name: Installer

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: installer-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"
  DOTNET_NOLOGO: "1"
  INNO_VERSION: "7.0.2"
  INNO_TAG: "is-7_0_2"
  UPGRADE_BASELINE_VERSION: "0.1.0"

jobs:
  package:
    name: Windows · publish · install · upgrade · uninstall
    runs-on: windows-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Acquire verified Inno Setup compiler
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $downloadDir = Join-Path $env:RUNNER_TEMP "inno-download"
          $installDir = Join-Path $env:RUNNER_TEMP "InnoSetup7"
          New-Item -ItemType Directory -Path $downloadDir -Force | Out-Null

          gh release download $env:INNO_TAG `
            --repo jrsoftware/issrc `
            --pattern "innosetup-$($env:INNO_VERSION)-x64.exe" `
            --dir $downloadDir `
            --clobber

          $asset = Join-Path $downloadDir "innosetup-$($env:INNO_VERSION)-x64.exe"
          gh release verify-asset $asset --repo jrsoftware/issrc

          $process = Start-Process -FilePath $asset -ArgumentList @(
            "/VERYSILENT",
            "/SUPPRESSMSGBOXES",
            "/NORESTART",
            "/SP-",
            "/CURRENTUSER",
            "/DIR=$installDir"
          ) -Wait -PassThru
          if ($process.ExitCode -ne 0) {
            throw "Inno Setup installation failed with exit code $($process.ExitCode)."
          }

          $iscc = Join-Path $installDir "ISCC.exe"
          if (-not (Test-Path -LiteralPath $iscc -PathType Leaf)) {
            throw "ISCC.exe was not installed at $iscc."
          }
          "INNO_ISCC=$iscc" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Build older upgrade fixture
        shell: pwsh
        run: |
          .\scripts\build-installer.ps1 `
            -IsccPath "$env:INNO_ISCC" `
            -VersionOverride $env:UPGRADE_BASELINE_VERSION

          $baseline = Resolve-Path ".\artifacts\installer\AulaRaiz-Setup-$($env:UPGRADE_BASELINE_VERSION)-win-x64.exe"
          $fixtureDir = Join-Path $PWD "artifacts\upgrade-fixture"
          New-Item -ItemType Directory -Path $fixtureDir -Force | Out-Null
          $preserved = Join-Path $fixtureDir $baseline.Path.Split([IO.Path]::DirectorySeparatorChar)[-1]
          Copy-Item -LiteralPath $baseline.Path -Destination $preserved -Force
          "BASELINE_INSTALLER=$preserved" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Build current self-contained app, CLI and installer
        shell: pwsh
        run: .\scripts\build-installer.ps1 -IsccPath "$env:INNO_ISCC"

      - name: Smoke-test install, real upgrade, CLI and uninstall
        shell: pwsh
        run: |
          [xml]$props = Get-Content -LiteralPath ".\Directory.Build.props" -Raw
          $version = [string]$props.Project.PropertyGroup.VersionPrefix
          $installer = Resolve-Path ".\artifacts\installer\AulaRaiz-Setup-$version-win-x64.exe"
          $baselineInstaller = Resolve-Path $env:BASELINE_INSTALLER
          $installDir = Join-Path $env:LOCALAPPDATA "Programs\AulaRaiz"
          $appExe = Join-Path $installDir "SistemaDocente.App.Wpf.exe"
          $cliExe = Join-Path $installDir "aularaiz.exe"
          $sentinelDir = Join-Path $env:LOCALAPPDATA "SistemaDocenteNEM"
          $sentinel = Join-Path $sentinelDir "installer-ci-sentinel.txt"
          $uninstallKey = "HKCU:\Software\Microsoft\Windows\CurrentVersion\Uninstall\{7A2B71C7-3BC4-4D54-A7A2-97A0D56D4E5B}_is1"

          function Invoke-Setup([string]$Path) {
            $process = Start-Process -FilePath $Path -ArgumentList @(
              "/VERYSILENT",
              "/SUPPRESSMSGBOXES",
              "/NORESTART",
              "/SP-"
            ) -Wait -PassThru
            if ($process.ExitCode -ne 0) {
              throw "AulaRaíz installer failed with exit code $($process.ExitCode)."
            }
          }

          function Assert-InstalledVersion([string]$ExpectedVersion) {
            if (-not (Test-Path -LiteralPath $appExe -PathType Leaf)) {
              throw "Installed AulaRaíz executable was not found."
            }
            if (-not (Test-Path -LiteralPath $cliExe -PathType Leaf)) {
              throw "Installed AulaRaíz CLI executable was not found."
            }

            $fileVersion = [System.Diagnostics.FileVersionInfo]::GetVersionInfo($appExe)
            if (-not $fileVersion.ProductVersion.StartsWith($ExpectedVersion, [StringComparison]::Ordinal)) {
              throw "Installed ProductVersion '$($fileVersion.ProductVersion)' does not match '$ExpectedVersion'."
            }
            $cliVersion = [System.Diagnostics.FileVersionInfo]::GetVersionInfo($cliExe)
            if (-not $cliVersion.ProductVersion.StartsWith($ExpectedVersion, [StringComparison]::Ordinal)) {
              throw "Installed CLI ProductVersion '$($cliVersion.ProductVersion)' does not match '$ExpectedVersion'."
            }

            if (-not (Test-Path -LiteralPath $uninstallKey)) {
              throw "AulaRaíz uninstall registration was not found."
            }
            $displayVersion = (Get-ItemProperty -LiteralPath $uninstallKey).DisplayVersion
            if ($displayVersion -ne $ExpectedVersion) {
              throw "Installed DisplayVersion '$displayVersion' does not match '$ExpectedVersion'."
            }
          }

          function Assert-CliStatus([string]$ExpectedVersion) {
            $raw = & $cliExe status --json
            if ($LASTEXITCODE -ne 0) {
              throw "Installed AulaRaíz CLI status command failed with exit code $LASTEXITCODE."
            }
            $status = $raw | ConvertFrom-Json
            if (-not $status.success -or $status.schemaVersion -ne "1") {
              throw "Installed AulaRaíz CLI did not return the expected JSON envelope."
            }
            if ($status.data.version -ne $ExpectedVersion) {
              throw "Installed AulaRaíz CLI reported version '$($status.data.version)' instead of '$ExpectedVersion'."
            }
            if ($status.privacy.networkAccess) {
              throw "Installed AulaRaíz CLI unexpectedly reports network access."
            }
          }

          Invoke-Setup $baselineInstaller.Path
          Assert-InstalledVersion $env:UPGRADE_BASELINE_VERSION
          Assert-CliStatus $env:UPGRADE_BASELINE_VERSION

          New-Item -ItemType Directory -Path $sentinelDir -Force | Out-Null
          Set-Content -LiteralPath $sentinel -Value "preserve-me" -Encoding utf8

          Invoke-Setup $installer.Path
          Assert-InstalledVersion $version
          Assert-CliStatus $version

          $aulaRaizEntries = @(
            Get-ChildItem "HKCU:\Software\Microsoft\Windows\CurrentVersion\Uninstall" |
              ForEach-Object { Get-ItemProperty -LiteralPath $_.PSPath } |
              Where-Object { $_.DisplayName -eq "AulaRaíz" }
          )
          if ($aulaRaizEntries.Count -ne 1) {
            throw "Expected one AulaRaíz uninstall entry after upgrade, found $($aulaRaizEntries.Count)."
          }
          if (-not (Test-Path -LiteralPath $sentinel -PathType Leaf)) {
            throw "The legacy user-data sentinel disappeared during version upgrade."
          }

          $uninstaller = Get-ChildItem -LiteralPath $installDir -Filter "unins*.exe" | Select-Object -First 1
          if ($null -eq $uninstaller) {
            throw "AulaRaíz uninstaller was not found."
          }
          $uninstallProcess = Start-Process -FilePath $uninstaller.FullName -ArgumentList @(
            "/VERYSILENT",
            "/SUPPRESSMSGBOXES",
            "/NORESTART"
          ) -Wait -PassThru
          if ($uninstallProcess.ExitCode -ne 0) {
            throw "AulaRaíz uninstall failed with exit code $($uninstallProcess.ExitCode)."
          }

          if (Test-Path -LiteralPath $appExe) {
            throw "AulaRaíz program files remain after uninstall."
          }
          if (Test-Path -LiteralPath $cliExe) {
            throw "AulaRaíz CLI remains after uninstall."
          }
          if (-not (Test-Path -LiteralPath $sentinel -PathType Leaf)) {
            throw "Uninstall deleted the legacy user-data sentinel."
          }

          Remove-Item -LiteralPath $sentinel -Force

      - name: Show installer checksum
        shell: pwsh
        run: Get-FileHash .\artifacts\installer\AulaRaiz-Setup-*-win-x64.exe -Algorithm SHA256 | Format-List

      - name: Upload development installer
        uses: actions/upload-artifact@v7
        with:
          name: AulaRaiz-windows-installer
          path: artifacts/installer/AulaRaiz-Setup-*-win-x64.exe
          if-no-files-found: error

      - name: Upload manual upgrade-validation pair
        uses: actions/upload-artifact@v7
        with:
          name: AulaRaiz-upgrade-validation
          path: |
            artifacts/upgrade-fixture/AulaRaiz-Setup-*-win-x64.exe
            artifacts/installer/AulaRaiz-Setup-*-win-x64.exe
          if-no-files-found: error
