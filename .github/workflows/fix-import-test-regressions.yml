name: Fix import test regressions

on:
  push:
    branches:
      - feature/student-import-xlsx-csv

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: feature/student-import-xlsx-csv
      - name: Fix malformed XLSX translation and WPF expectation
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          xlsx = Path('src/SistemaDocente.Interchange/LectorXlsxTabular.cs')
          text = xlsx.read_text(encoding='utf-8')
          old = 'exception is IOException or UnauthorizedAccessException or OpenXmlPackageException or InvalidDataException)'
          new = 'exception is IOException or UnauthorizedAccessException or OpenXmlPackageException or InvalidDataException or FileFormatException)'
          if old not in text:
              raise SystemExit('XLSX exception filter marker not found')
          xlsx.write_text(text.replace(old, new, 1), encoding='utf-8')

          test = Path('tests/SistemaDocente.App.Wpf.Tests/ImportacionEstudiantesUiTests.cs')
          text = test.read_text(encoding='utf-8')
          old = 'Assert.Contains("Selecciona el archivo", xaml, StringComparison.Ordinal);'
          new = 'Assert.Contains("Selecciona una lista de alumnos", xaml, StringComparison.Ordinal);'
          if old not in text:
              raise SystemExit('WPF expectation marker not found')
          test.write_text(text.replace(old, new, 1).rstrip('\r\n'), encoding='utf-8')
          PY
          git rm .github/workflows/fix-import-test-regressions.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/SistemaDocente.Interchange/LectorXlsxTabular.cs tests/SistemaDocente.App.Wpf.Tests/ImportacionEstudiantesUiTests.cs
          git commit -m "fix: normalize malformed XLSX errors and UI regression expectation"
          git push origin HEAD:feature/student-import-xlsx-csv
