name: Fix import test final newlines

on:
  push:
    branches:
      - feature/student-import-xlsx-csv

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: feature/student-import-xlsx-csv
      - name: Strip final newlines and remove temporary workflow
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          files = [
              Path('tests/SistemaDocente.Data.Tests/ImportacionEstudiantesSqliteTests.cs'),
              Path('tests/SistemaDocente.Presentation.Tests/ImportacionEstudiantesViewModelTests.cs'),
              Path('tests/SistemaDocente.App.Wpf.Tests/ImportacionEstudiantesUiTests.cs'),
          ]
          for path in files:
              text = path.read_text(encoding='utf-8')
              path.write_text(text.rstrip('\r\n'), encoding='utf-8')
          PY
          git rm .github/workflows/fix-import-test-newlines.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/SistemaDocente.Data.Tests/ImportacionEstudiantesSqliteTests.cs \
                  tests/SistemaDocente.Presentation.Tests/ImportacionEstudiantesViewModelTests.cs \
                  tests/SistemaDocente.App.Wpf.Tests/ImportacionEstudiantesUiTests.cs
          git commit -m "style: fix import test final newlines"
          git push origin HEAD:feature/student-import-xlsx-csv
