name: Cleanup merged import branches

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  cleanup:
    if: github.head_ref == 'chore/cleanup-student-import-branch'
    runs-on: ubuntu-latest
    steps:
      - name: Delete obsolete branches
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git push "https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git" --delete feature/student-import-xlsx-csv || true
          git push "https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git" --delete chore/cleanup-student-import-branch || true
